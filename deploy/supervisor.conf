# Installed by deploy/setup.sh, which fills in __APP_DIR__ and __APP_USER__.

[program:stack-duel-reverb]
command=php __APP_DIR__/artisan reverb:start --host=127.0.0.1 --port=8085
directory=__APP_DIR__
user=__APP_USER__
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

[program:stack-duel-bots]
command=php __APP_DIR__/artisan bots:play
directory=__APP_DIR__
user=__APP_USER__
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/bots.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
